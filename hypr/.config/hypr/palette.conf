# ~/.config/hypr/palette.conf
# Palette de base — Nord Violet. Couleurs hors accent synchronisées à la main.
# Accent commun choisi : #9b7cff. Le réglage Apparence du Control Center
# le propage via accentctl.sh à Hyprland, Waybar, Mako, Hyprlock, GTK,
# Alacritty (curseur), Fuzzel et wlogout, lorsqu'ils sont configurés.

$bg0        = 0xff0e1015   # fond le plus sombre
$bg1        = 0xff171a21   # fond wallpaper haut
$bg2        = 0xff1f232d   # fond fenêtres (base, avant transparence)
$surface    = 0xe62e3440   # fenêtre avec alpha ~90%

$fg0        = 0xffc4cad4   # texte principal
$fg1        = 0xff8995a6   # texte secondaire (contraste remonté v3)
$fg2        = 0xff626b7b   # texte muted

$border_inactive = 0xff3b4252
$border_active   = 0xff9b7cff   # violet — accent, PAS partout

$accent     = 0xff9b7cff   # violet — workspace actif, curseur, sélection
$accent_dim = 0x409b7cff   # violet à 25% — glow, ring wallpaper

$grey       = 0xff4c566a   # séparateurs, dots inactifs
