# ~/.config/hypr/animations.conf
# Identité du prototype = minimaliste, mat, pas de show-off.
# Donc : animations courtes et discrètes, pas de bounce exagéré.
# Ajuste les courbes une fois que tu vois le rendu réel sur ton écran.

animations {
    enabled = yes

    bezier = smooth, 0.25, 0.1, 0.25, 1.0

    animation = windows, 1, 3, smooth
    animation = windowsOut, 1, 3, smooth, popin 85%
    animation = border, 1, 4, smooth
    animation = fade, 1, 3, smooth
    animation = workspaces, 1, 3, smooth
}


bezier = easeOutExpo, 0.16, 1, 0.3, 1
animation = specialWorkspace, 1, 3, easeOutExpo, slidevert
