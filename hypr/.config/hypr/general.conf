# ~/.config/hypr/general.conf
# Layouts, gaps, bordures - dépend de palettes.conf (sourcé avant celui-ci)

general {
    gaps_in = 4
    gaps_out = 8
    border_size = 2

    col.active_border = $accent
    col.inactive_border = $border_inactive

    layout = dwindle
    resize_on_border = true
}

dwindle {
    preserve_split = true
}
