# ~/.config/hypr/autostart.conf
# Démarrage des daemons — waybar, notifs, idle, polkit, clipboard history.
# Dédupliqué le 22/08 : hypridle/hyprpaper/mako ne doivent apparaître QU'ICI,
# plus dans hyprland.conf (voir piège #26 dans le handoff v1).
#
# hypridle retiré le 22/08 (session productivité v2) : plus de veille écran
# ni de verrouillage automatique par inactivité. hyprlock reste dispo
# manuellement via SUPER+L (voir keybinds.conf). Fermeture de capot laptop
# gérée séparément par systemd-logind (HandleLidSwitch=suspend, valeur par
# défaut, non modifiée), indépendante de ce fichier.

exec-once = hyprpaper
exec-once = waybar
exec-once = mako
exec-once = /usr/lib/polkit-gnome/polkit-gnome-authentication-agent-1
exec-once = wl-paste --watch cliphist store
exec-once = nm-applet --indicator

# Écran de veille visuel manuel (SUPER+SHIFT+I), sans veille automatique.
exec-once = qs -n -d -c nord-violet-idle

# --- Scratchpads : lancés cachés au démarrage, prêts à toggle instantanément ---
exec-once = [workspace special:scratch silent] alacritty --class scratchterm
exec-once = [workspace special:monitoring silent] alacritty --class monitoring -e btop
