# ~/.config/hypr/keybinds.conf
# Mapping 1:1 avec le cheatsheet du prototype HTML (Nord Violet v4).
# Couche productivité (special workspaces, resize, floating) ajoutée le 22/08.
# toggle-app.sh remplace toggle-scratch.sh : lance l'appli si absente, puis toggle.
#
# ATTENTION (22/08, session v2) : touche scratchpad terminal corrigée de
# `grave` à `ugrave` — sur clavier AZERTY, le keysym `grave` correspond à la
# touche `²` (au-dessus de Tab), PAS à `ù`. `ugrave` est le bon keysym pour
# la touche physique `ù`. Vérifié avec `wev`.
#
# ATTENTION (23/08, session v6) : switch-desktop.sh abandonné sur demande.
# SUPER+1..5 et SUPER+6..0 sont maintenant complètement indépendants : chacun
# ne fait `workspace, N` en direct que sur SON écran (1-5=HDMI-A-1 pinné,
# 6-0=eDP-1 pinné). Changer h ne touche plus jamais e et inversement — plus
# d'effet "bureau synchronisé", c'est un choix explicite (l'ancien
# comportement bougeait les deux écrans en même temps, plus voulu).
# code:10-19 = touches physiques 1-0, indépendant du layout AZERTY (voir
# note plus haut sur le bug ampersand/é/"/etc).

# --- Windows ---
bind = $mainMod, Return, exec, python3 ~/.config/hypr/scripts/terminal-here.py
bind = $mainMod SHIFT, Return, exec, /home/toubi/.local/bin/terminal-deck
bind = $mainMod, Q, killactive
bind = $mainMod, E, exec, alacritty --class yazi -e yazi /home/toubi
bind = $mainMod SHIFT, E, exec, thunar
bind = ALT, Space, exec, fuzzel
bind = $mainMod, Space, exec, ~/.local/bin/omni-launcher
bind = $mainMod, C, exec, qs -c nord-violet-cc ipc call cc toggle

# --- System ---
# Maximiser sans masquer la barre.
bind = $mainMod, F, fullscreen, 1
# Vrai plein écran : couvre Waybar. Même raccourci pour revenir.
bind = $mainMod CTRL, F, fullscreen, 0
bind = $mainMod, V, exec, ~/.local/bin/omni-clipboard
bind = $mainMod, W, exec, ~/.local/bin/omni-windows
bind = $mainMod SHIFT, S, exec, ~/.config/hypr/scripts/swappy-region.sh
bind = , Print, exec, ~/.config/hypr/scripts/swappy-region.sh
bind = CTRL, Print, exec, ~/.config/hypr/scripts/swappy-fullscreen.sh
bind = CTRL SHIFT, Print, exec, ~/.config/hypr/scripts/swappy-monitor.sh

# --- Workspaces / "bureaux" (cf. windowrules.conf pour le placement auto par
# app, cf. monitors.conf pour le pinning HDMI-A-1=1-5 / eDP-1=11-15) ---
# SUPER+1..5 = workspace, N direct sur HDMI-A-1. SUPER+6..0 = workspace, N+10
# direct sur eDP-1. Complètement indépendants (voir point 8 du handoff) :
# changer de bureau sur un écran ne touche jamais l'autre.
bind = $mainMod, code:10, workspace, 1
bind = $mainMod, code:11, workspace, 2
bind = $mainMod, code:12, workspace, 3
bind = $mainMod, code:13, workspace, 4
bind = $mainMod, code:14, workspace, 5

bind = $mainMod, code:15, workspace, 11
bind = $mainMod, code:16, workspace, 12
bind = $mainMod, code:17, workspace, 13
bind = $mainMod, code:18, workspace, 14
bind = $mainMod, code:19, workspace, 15

# Pavé numérique : codes physiques différents de la rangée du haut, donc
# code:10-19 ne les capte pas — codes numpad ajoutés en parallèle. Bindés
# par CODE (pas keysym KP_1) pour marcher pareil avec ou sans Numlock —
# sans Numlock les mêmes touches envoient KP_End/KP_Down/etc au lieu de
# KP_1/KP_2/etc, mais le code physique (87,88,89,83,84,85,79,80,81,90) ne
# change pas. Vérifié avec wev.
bind = $mainMod, code:87, workspace, 1
bind = $mainMod, code:88, workspace, 2
bind = $mainMod, code:89, workspace, 3
bind = $mainMod, code:83, workspace, 4
bind = $mainMod, code:84, workspace, 5

bind = $mainMod, code:85, workspace, 11
bind = $mainMod, code:79, workspace, 12
bind = $mainMod, code:80, workspace, 13
bind = $mainMod, code:81, workspace, 14
bind = $mainMod, code:90, workspace, 15

# --- Déplacer une fenêtre vers un workspace ---
# v5 : simplifié de 4 touches (CTRL+SUPER+SHIFT) à 3 (CTRL+SUPER). 1-5 vers
# HDMI-A-1, 6-0 vers eDP-1 (11-15) — même logique de touches que la
# navigation juste au-dessus, donc facile à retenir : la touche du haut du
# clavier dit "où", CTRL+SUPER dit "déplace la fenêtre plutôt que d'y aller".
bind = $mainMod CTRL, code:10, movetoworkspace, 1
bind = $mainMod CTRL, code:11, movetoworkspace, 2
bind = $mainMod CTRL, code:12, movetoworkspace, 3
bind = $mainMod CTRL, code:13, movetoworkspace, 4
bind = $mainMod CTRL, code:14, movetoworkspace, 5

bind = $mainMod CTRL, code:15, movetoworkspace, 11
bind = $mainMod CTRL, code:16, movetoworkspace, 12
bind = $mainMod CTRL, code:17, movetoworkspace, 13
bind = $mainMod CTRL, code:18, movetoworkspace, 14
bind = $mainMod CTRL, code:19, movetoworkspace, 15

bind = $mainMod CTRL, code:87, movetoworkspace, 1
bind = $mainMod CTRL, code:88, movetoworkspace, 2
bind = $mainMod CTRL, code:89, movetoworkspace, 3
bind = $mainMod CTRL, code:83, movetoworkspace, 4
bind = $mainMod CTRL, code:84, movetoworkspace, 5

bind = $mainMod CTRL, code:85, movetoworkspace, 11
bind = $mainMod CTRL, code:79, movetoworkspace, 12
bind = $mainMod CTRL, code:80, movetoworkspace, 13
bind = $mainMod CTRL, code:81, movetoworkspace, 14
bind = $mainMod CTRL, code:90, movetoworkspace, 15

# NB : Super+Maj+flèches déplace la fenêtre ; Super+Ctrl+flèches la
# redimensionne. Aucune collision avec les raccourcis numériques ci-dessus.

# --- Navigation fenêtres ---
bind = $mainMod, left,  movefocus, l
bind = $mainMod, right, movefocus, r
bind = $mainMod, up,    movefocus, u
bind = $mainMod, down,  movefocus, d

# --- Déplacer fenêtre ---
bind = $mainMod SHIFT, left, movewindow, l
bind = $mainMod SHIFT, right, movewindow, r
bind = $mainMod SHIFT, up, movewindow, u
bind = $mainMod SHIFT, down, movewindow, d

# --- Souris : déplacer/resize fenêtre flottante ---
bindm = $mainMod, mouse:272, movewindow
bindm = $mainMod, mouse:273, resizewindow

# --- Resize clavier ---
bind = $mainMod CTRL, left, resizeactive, -40 0
bind = $mainMod CTRL, right, resizeactive, 40 0
bind = $mainMod CTRL, up, resizeactive, 0 -40
bind = $mainMod CTRL, down, resizeactive, 0 40

# --- Floating toggle (avec resize + center auto) ---
bind = $mainMod, T, exec, python3 ~/.config/hypr/scripts/float-cascade.py

# --- Special workspaces (scratchpads) ---
# toggle-app.sh <special> <class> <launch_cmd> [center|bottom] : lance l'appli
# si absente, route/toggle + recentre sur le moniteur focus à chaque appel.
# scratch utilise "bottom" (dropdown ancré en bas) — voir piège #33/#34.
bind = $mainMod, D, exec, ~/.config/hypr/scripts/toggle-app.sh discord discord discord
bind = $mainMod, ugrave, exec, ~/.config/hypr/scripts/toggle-app.sh scratch scratchterm 'alacritty --class scratchterm' bottom
bind = $mainMod, M, exec, ~/.config/hypr/scripts/toggle-app.sh monitoring monitoring 'alacritty --class monitoring -e btop --update 100'

# Falcon : instance conservée, géométrie préparée avant affichage.
bind = $mainMod, B, exec, python3 ~/.config/hypr/scripts/falcon-popup.py

# --- Lock ---
bind = $mainMod, L, exec, hyprlock

# --- Wlogout ---
bind = CTRL, Escape, exec, python3 ~/.config/wlogout/launch.py

# --- Settings ---
bind = $mainMod, S, exec, qs -c nord-violet-cc ipc call settings toggle
bind = $mainMod SHIFT, P, exec, qs -c nord-violet-cc ipc call settings page profiles

# --- Focus ---
bind = $mainMod SHIFT, F, exec, ~/.config/quickshell/nord-violet-cc/scripts/focusctl.sh toggle 50

# --- Idle ---
bind = SUPER SHIFT, I, exec, ~/.config/hypr/scripts/idle-toggle.sh

# --- Emoji-Picker ---
bind = $mainMod, N, exec, ~/.local/bin/omni-emoji

# --- Volume / Luminosité ---
# `bindl` (locked = marche même écran verrouillé, standard pour les
# touches média). Pas de bind XF86 existant avant ce patch — vérifié
# dans ce fichier avant d'ajouter, aucune collision possible.
bindlk = , XF86AudioRaiseVolume, !rk-r98pro rk-r98pro-keyboard, exec, ~/.config/hypr/scripts/osd-trigger.sh volume up
bindlk = , XF86AudioLowerVolume, !rk-r98pro rk-r98pro-keyboard, exec, ~/.config/hypr/scripts/osd-trigger.sh volume down
bindlk = , XF86AudioMute, !rk-r98pro rk-r98pro-keyboard, exec, ~/.config/hypr/scripts/osd-trigger.sh volume mute
bindlk = , XF86AudioMute, rk-r98pro rk-r98pro-keyboard, exec, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl = , XF86MonBrightnessUp, exec, ~/.config/hypr/scripts/osd-trigger.sh brightness up
bindl = , XF86MonBrightnessDown, exec, ~/.config/hypr/scripts/osd-trigger.sh brightness down

# RK R98Pro : commandes audio natives (molette et Fn+F11/F12).
# wpctl direct : pas de processus Python ni de lecture audio par cran.
bindlk = , XF86AudioRaiseVolume, rk-r98pro rk-r98pro-keyboard, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 1%+
bindlk = , XF86AudioLowerVolume, rk-r98pro rk-r98pro-keyboard, exec, wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 1%-
# Ctrl+molette : écran focalisé ; les touches du portable restent inchangées.
bindk = CTRL, XF86AudioRaiseVolume, rk-r98pro rk-r98pro-keyboard, exec, python3 ~/.config/hypr/scripts/active-brightness.py 5
bindk = CTRL, XF86AudioLowerVolume, rk-r98pro rk-r98pro-keyboard, exec, python3 ~/.config/hypr/scripts/active-brightness.py -5
bindlk = , XF86AudioPrev, rk-r98pro rk-r98pro-keyboard, exec, playerctl previous
bindlk = , XF86AudioPlay, rk-r98pro rk-r98pro-keyboard, exec, playerctl play-pause
bindlk = , XF86AudioNext, rk-r98pro rk-r98pro-keyboard, exec, playerctl next
bindlk = , XF86AudioStop, rk-r98pro rk-r98pro-keyboard, exec, playerctl stop
# Fn+F1..F5 : raccourcis Windows correspondants, sans détourner F1..F5 seuls.
bindk = , XF86Explorer, rk-r98pro rk-r98pro-keyboard, exec, alacritty --class yazi -e yazi /home/toubi
bindk = , XF86MyComputer, rk-r98pro rk-r98pro-keyboard, exec, alacritty --class yazi -e yazi /home/toubi
bindk = , XF86WWW, rk-r98pro rk-r98pro-keyboard, exec, gtk-launch firefox
bindk = , XF86HomePage, rk-r98pro rk-r98pro-keyboard, exec, gtk-launch firefox
bindk = , XF86Mail, rk-r98pro rk-r98pro-keyboard, exec, python3 '/home/toubi/01 - Dev/00 - Projets à tester/python--emailclean/launch.py'
bindk = , XF86Calculator, rk-r98pro rk-r98pro-keyboard, exec, ~/.local/bin/calc
bindk = , XF86AudioMedia, rk-r98pro rk-r98pro-keyboard, exec, python3 ~/.config/hypr/scripts/spotify-focus.py
bindk = , XF86Audio, rk-r98pro rk-r98pro-keyboard, exec, python3 ~/.config/hypr/scripts/spotify-focus.py
bindk = , XF86Music, rk-r98pro rk-r98pro-keyboard, exec, python3 ~/.config/hypr/scripts/spotify-focus.py
# Fn+F5 réel de ce RK : XF86Tools (capture wev du 7 octobre).
bindk = , XF86Tools, rk-r98pro rk-r98pro-keyboard, exec, python3 ~/.config/hypr/scripts/spotify-focus.py

# Lenovo LOQ 15ARP9 : événements multimédias, pas les touches F seules.
$laptopKeys = at-translated-set-2-keyboard ite-tech.-inc.-ite-device(8176)-keyboard ideapad-extra-buttons video-bus video-bus-1
bindlk = , XF86AudioMicMute, $laptopKeys, exec, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindk = , XF86Calculator, $laptopKeys, exec, ~/.local/bin/calc
bindk = , XF86Display, $laptopKeys, exec, qs -c nord-violet-cc ipc call settings page displays
# Certaines touches Lenovo émettent directement des combinaisons Windows.
bindk = SUPER, P, $laptopKeys, exec, qs -c nord-violet-cc ipc call settings page displays
# Alt+Tab sur les deux claviers : inclure les autres bureaux, même s'il
# n'y a qu'une application sur le bureau courant.
bind = ALT, Tab, exec, python3 ~/.config/hypr/scripts/window-cycle.py
bind = ALT SHIFT, Tab, exec, python3 ~/.config/hypr/scripts/window-cycle.py --reverse
# Signaux réels Fn+F9/F10/F11 du LOQ, capturés avec wev le 8 octobre.
bindk = , XF86Favorites, $laptopKeys, exec, ~/.local/bin/omni-launcher
# Le firmware envoie un état On/Off : appliquer cet état, pas une seconde bascule.
bindk = , XF86TouchpadOff, $laptopKeys, exec, hyprctl keyword 'device[elan06fa:00-04f3:327e-touchpad]:enabled' false
bindk = , XF86TouchpadOn, $laptopKeys, exec, hyprctl keyword 'device[elan06fa:00-04f3:327e-touchpad]:enabled' true
bindk = CTRL ALT, Tab, $laptopKeys, exec, ~/.local/bin/omni-windows
