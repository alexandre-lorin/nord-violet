# hyprlock v0.9.6 — Nord Violet v4 "Station" (multi-monitor)
#
# Fond verrouillage : halo-wallpaper-4k.jpg (bureau : wp1.png).
# Horloge/date/password réglées séparément
# par écran — les valeurs absolues ne scalent pas automatiquement entre
# HDMI-A-1 (2560x1440, validé en vrai) et eDP-1 (1920x1080, laptop, ratio 0.75).
#
# Password : hide_input = true -> AUCUN retour visuel en tapant, ni dots ni longueur.

general {
    hide_cursor = false
}

background {
    monitor =
    path = ~/.config/hypr/wallpapers/nord-violet-station-final.png
    blur_passes = 0
    color = rgb(020204)
}

# ===== HDMI-A-1 (2560x1440) — valeurs validées, inchangées =====

label {
    monitor = HDMI-A-1
    text = $TIME
    color = rgba(e8eaf1ff)
    font_size = 166
    font_family = JetBrains Mono
    position = 0, 432
    halign = center
    valign = center
    shadow_passes = 0
}

label {
    monitor = HDMI-A-1
    text = cmd[update:60000] LC_TIME=fr_FR.UTF-8 date +'%A %d %B' | tr '[:lower:]' '[:upper:]'
    color = rgba(8995a6ff)
    font_size = 22
    font_family = JetBrains Mono
    position = 0, 250
    halign = center
    valign = center
    shadow_passes = 0
}

input-field {
    monitor = HDMI-A-1
    size = 220, 46
    outline_thickness = 0
    dots_size = 0.2
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(0,0,0,0)
    inner_color = rgba(0,0,0,0)
    font_color = rgba(c4cad4ff)
    fade_on_empty = false
    hide_input = true
    placeholder_text = <span foreground="grey">•</span>
    fail_text = <span foreground="indianred">échec</span>
    check_color = rgba(9b7cffff)
    fail_color = rgba(bf616aff)
    position = 0, -560
    halign = center
    valign = center
}

# ===== eDP-1 (1920x1080, laptop) — scalé au ratio 0.75 =====

label {
    monitor = eDP-1
    text = $TIME
    color = rgba(e8eaf1ff)
    font_size = 124
    font_family = JetBrains Mono
    position = 0, 324
    halign = center
    valign = center
    shadow_passes = 0
}

label {
    monitor = eDP-1
    text = cmd[update:60000] LC_TIME=fr_FR.UTF-8 date +'%A %d %B' | tr '[:lower:]' '[:upper:]'
    color = rgba(8995a6ff)
    font_size = 16
    font_family = JetBrains Mono
    position = 0, 188
    halign = center
    valign = center
    shadow_passes = 0
}

input-field {
    monitor = eDP-1
    size = 165, 34
    outline_thickness = 0
    dots_size = 0.2
    dots_spacing = 0.3
    dots_center = true
    outer_color = rgba(0,0,0,0)
    inner_color = rgba(0,0,0,0)
    font_color = rgba(c4cad4ff)
    fade_on_empty = false
    hide_input = true
    placeholder_text = <span foreground="grey">•</span>
    fail_text = <span foreground="indianred">échec</span>
    check_color = rgba(9b7cffff)
    fail_color = rgba(bf616aff)
    position = 0, -420
    halign = center
    valign = center
}
