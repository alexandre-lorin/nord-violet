# ~/.config/hypr/hyprland.conf
# Point d'entrée — ne contient RIEN d'autre que des sources.
# Le contenu réel se règle en live sur ta vraie session, pas à l'aveugle.

$mainMod = SUPER

source = ~/.config/hypr/palette.conf
source = ~/.config/hypr/general.conf
source = ~/.config/hypr/monitors.conf
source = ~/.config/hypr/input.conf
source = ~/.config/hypr/autostart.conf
source = ~/.config/hypr/keybinds.conf
source = ~/.config/hypr/windowrules.conf
source = ~/.config/hypr/animations.conf
source = ~/.config/hypr/decoration.conf

misc {
    disable_splash_rendering = true
}

windowrule = match:title ^(Nord Violet Control Center)$, float on, center on, size 560 480
windowrule = match:title ^(Nord Violet Idle)$, fullscreen on, immediate on

exec-once = qs -c nord-violet-cc
env = QT_QPA_PLATFORMTHEME,qt5ct
bind = SUPER, G, exec, ~/.local/bin/mode/toggle-mode.sh

# Omni — recherche unifiée (installé le 2026-08-28)
bind = SUPER, SPACE, exec, omni --dmenu-launch --files-root $HOME/01\ -\ Dev/01\ -\ Projets\ Actifs --notes-root $HOME/09\ -\ Vault/2nd\ Cerveau --actions-config $HOME/.config/omni/actions.toml --plugins-dir $HOME/.config/omni/plugins --no-watch
