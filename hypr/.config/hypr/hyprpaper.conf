# ~/.config/hypr/hyprpaper.conf
# Fix v6 (23/08) : chemin corrigé de ~/.config/hypr/wallpapers/ (avec un s,
# n'existait pas) vers ~/.config/hypr/wallpaper/ (sans s, dossier réel sur
# le disque). hyprpaper démarrait sans erreur mais ne trouvait jamais
# l'image, donc rien ne s'affichait après reboot.
#
# Rappel : `hyprctl reload` ne recharge PAS hyprpaper (seulement Hyprland
# lui-même). Après modif de ce fichier : `pkill hyprpaper && hyprpaper &`.
# `hyprctl hyprpaper listloaded` semble buggé sur cette build (répond
# systématiquement "invalid hyprpaper request") — ignorer, vérifier à l'oeil.

preload = /home/toubi/.config/hypr/wallpaper/wp1.png
splash = false

wallpaper {
    monitor = eDP-1
    path = /home/toubi/.config/hypr/wallpaper/wp1.png
    fit_mode = cover
}
wallpaper {
    monitor = HDMI-A-1
    path = /home/toubi/.config/hypr/wallpaper/wallpaper-ascii-1440p.png
    fit_mode = cover
}
