# Dictée locale dans Terminal Deck / Alacritty — F8 reste natif.
bind = , F9, exec, python3 ~/.config/hypr/scripts/codex-dictation.py toggle
submap = codex-dictation
bind = , F9, exec, python3 ~/.config/hypr/scripts/codex-dictation.py toggle
bind = , Return, exec, python3 ~/.config/hypr/scripts/codex-dictation.py send
bind = , KP_Enter, exec, python3 ~/.config/hypr/scripts/codex-dictation.py send
bind = , Escape, exec, python3 ~/.config/hypr/scripts/codex-dictation.py cancel
# Ne pas envoyer une deuxième Entrée ou du texte pendant la transcription.
bind = , catchall, exec, true
submap = reset
