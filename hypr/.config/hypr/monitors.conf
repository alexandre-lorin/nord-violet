# ~/.config/hypr/monitors.conf
monitor = HDMI-A-1, 2560x1440@144, 0x0, 1
monitor = eDP-1, 1920x1080@144, 2560x0, 1

# --- Workspaces pinnés par moniteur : bureaux façon Windows (ajouté 22/08 v4) ---
# HDMI-A-1 (principal, 2560x1440) porte 1-5, eDP-1 (laptop, 1920x1080) porte
# 11-15. Depuis le v6 (point 8), SUPER+1..5 / SUPER+6..0 basculent chaque
# écran indépendamment (workspace, N direct) — switch-desktop.sh n'est plus
# utilisé, voir keybinds.conf.
#
# persistent:true est nécessaire (pas juste monitor:) : sans lui, waybar et
# Hyprland n'enregistrent le pinning qu'"au cas où" — le workspace n'existe
# vraiment, rattaché au bon moniteur, qu'une fois visité. Avec persistent:true
# les 10 workspaces sont créés et vivent en permanence dès le reload, même à
# vide. C'est aussi ce qui a réglé le désync waybar (elle lit "Hyprland
# workspace rules" en priorité ; un bloc persistent-workspaces manuel dans
# waybar/config.jsonc en plus créait un conflit à deux sources — retiré).
#
# Piège vécu le 22/08 : un workspace déjà peuplé de fenêtres AVANT l'ajout du
# pinning ne migre pas tout seul au reload. Il a fallu forcer une fois :
#   hyprctl dispatch moveworkspacetomonitor <id> <moniteur>
# Seulement nécessaire pour un workspace qui existait déjà côté ancien setup.
workspace = 1, monitor:HDMI-A-1, default:true, persistent:true
workspace = 2, monitor:HDMI-A-1, persistent:true
workspace = 3, monitor:HDMI-A-1, persistent:true
workspace = 4, monitor:HDMI-A-1, persistent:true
workspace = 5, monitor:HDMI-A-1, persistent:true
workspace = 11, monitor:eDP-1, default:true, persistent:true
workspace = 12, monitor:eDP-1, persistent:true
workspace = 13, monitor:eDP-1, persistent:true
workspace = 14, monitor:eDP-1, persistent:true
workspace = 15, monitor:eDP-1, persistent:true
