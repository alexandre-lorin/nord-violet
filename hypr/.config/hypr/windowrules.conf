# ~/.config/hypr/windowrules.conf
# Gestion réseau en véritable TUI, dans le terminal du rice.
windowrule = float on, match:class ^(network-tui)$
windowrule = center on, match:class ^(network-tui)$
# class vérifiée en vrai via `hyprctl clients` le 09/08 + 22/08 (v2)
#
# ATTENTION (22/08, session v4) : syntaxe unifiée uniquement. `windowrulev2`
# est deprecated et fait planter le reload (erreur "invalid field float:
# missing a value" si tu oublies le "on"/"off" en plus). Toujours
# `windowrule = <action>, match:<sélecteur> <valeur>`.

# --- Placement automatique par app ---
# NB (v4) : ces workspaces étant pinnés à HDMI-A-1/eDP-1 (monitors.conf),
# une app linkée ici s'ouvre toujours sur le même écran, peu importe l'écran
# actif au lancement.
#
# 23/08 : firefox et thunar délinkés sur demande (l'utilisateur veut pouvoir
# les ouvrir où il veut, pas figés sur un workspace). Spotify déplacé de 5
# vers 15 (pinné eDP-1, cf. monitors.conf).
windowrule = workspace 3, match:class ^(obsidian)$
windowrule = workspace 15 silent, match:class ^(Spotify)$

# --- Floating intelligent ---
windowrule = float on, match:class ^(org\.pulseaudio\.pavucontrol)$
windowrule = size 500 400, match:class ^(org\.pulseaudio\.pavucontrol)$
windowrule = center on, match:class ^(org\.pulseaudio\.pavucontrol)$

windowrule = opacity 0.92, match:class ^(mpv)$
windowrule = float on, match:class ^(mpv)$

# --- Discord = special workspace, jamais de place fixe ---
# float on ajouté le 22/08 : sans ça la fenêtre était tuilée dans le special
# workspace, donc resizewindowpixel/movewindowpixel du script n'avaient pas
# vraiment d'effet (elle apparaissait au dernier endroit du tiling, qui
# donnait l'impression de "suivre la souris"). Même traitement que
# scratchterm/monitoring désormais.
windowrule = workspace special:discord silent, match:class ^(discord)$
windowrule = float on, match:class ^(discord)$

# --- Scratch (terminal rapide) : dropdown bottom, position recalculée
# à chaque toggle par toggle-app.sh (pas de move statique ici, voir piège #29).
# animation slidevert branchée le 22/08, bezier easeOutExpo dans animations.conf ---
windowrule = workspace special:scratch silent, match:class ^(scratchterm)$
windowrule = float on, match:class ^(scratchterm)$
windowrule = size 1000 650, match:class ^(scratchterm)$
windowrule = animation slidevert, match:class ^(scratchterm)$

# --- Monitoring : centré, comportement inchangé ---
windowrule = workspace special:monitoring silent, match:class ^(monitoring)$
windowrule = float on, match:class ^(monitoring)$
windowrule = size 1200 700, match:class ^(monitoring)$
windowrule = move (monitor_w/2 - window_w/2) (monitor_h/2 - window_h/2), match:class ^(monitoring)$

# --- Dialogs/popups secondaires : flottent, jamais tuilés (ajouté 22/08 v4) ---
# Heuristique par titre (pas de flag universel "dialog" dans Hyprland, et
# beaucoup d'apps Qt/legacy ne posent pas la relation parent-enfant XDG
# proprement, donc Hyprland les tuile par défaut comme une fenêtre normale).
# Complète au fil de l'eau si une popup précise passe entre les mailles
# (récupère son titre exact via `hyprctl clients -j` pendant qu'elle est ouverte).
#
# Ajouts 23/08 (v6, pas testés en live, hypothèse de cause probable) : la
# liste d'origine ne couvrait que des titres anglais (Settings/Preferences/
# Confirm/Warning/Error...). Si l'appli tourne en locale FR (Thunar, GTK),
# ses dialogues ont des titres français qui ne matchaient aucune règle ->
# tuilés au lieu de flotter. D'où le doublon EN/FR ci-dessous. À confirmer
# en vrai : ouvrir le dialogue concerné, `hyprctl clients -j` pour lire son
# titre exact, ajuster la regex si besoin (variante d'accent, casse, etc).
windowrule = float on, match:title ^(.*[Ss]ettings.*)$
windowrule = float on, match:title ^(.*[Pp]ar(a|à)m(è|e)tres.*)$
windowrule = float on, match:title ^(.*[Pp]references.*)$
windowrule = float on, match:title ^(.*[Pp]r(é|e)f(é|e)rences.*)$
windowrule = float on, match:title ^(.*[Rr]églages.*)$
windowrule = float on, match:title ^(.*[Aa]bout.*)$
windowrule = float on, match:title ^(.*[Àà] propos.*)$
windowrule = float on, match:title ^(Open File)$
windowrule = float on, match:title ^(Save (File|As))$
windowrule = float on, match:title ^(.*[Oo]uvrir.*[Ff]ichier.*)$
windowrule = float on, match:title ^(.*[Ee]nregistrer (sous|le fichier).*)$
windowrule = float on, match:title ^(Confirm.*)$
windowrule = float on, match:title ^(.*[Cc]onfirm(er|ation).*)$
windowrule = float on, match:title ^(.*[Ww]arning.*)$
windowrule = float on, match:title ^(.*[Aa]vertissement.*)$
windowrule = float on, match:title ^(.*[Ee]rror.*)$
windowrule = float on, match:title ^(.*[Ee]rreur.*)$
windowrule = float on, match:title ^(.*[Pp]ropri(é|e)t(é|e)s.*)$

# --- Thunar : opérations fichiers (renommer/supprimer/déplacer/remplacer) ---
# Signalé 23/08 : ces dialogues s'ouvraient en tuilé (nouvelle "fenêtre"
# dans le tiling) au lieu d'un popup, très probablement pour la même raison
# de locale (titres FR non matchés). Titres FR dynamiques (contiennent le
# nom du fichier) -> regex large sur le mot-clé, pas d'ancrage ^...$ strict.
windowrule = float on, match:title .*[Rr]enommer.*
windowrule = float on, match:title .*[Ss]upprimer.*
windowrule = float on, match:title .*[Dd]éplacer.*
windowrule = float on, match:title .*[Rr]emplacer.*
windowrule = float on, match:title .*[Cc]opier.*

# Fenêtre de progression du déplacement (barre de progression, pas la
# confirmation) : toujours en tuilé plein écran malgré la règle "Déplacer"
# ci-dessus -> son titre n'est vraisemblablement PAS "Déplacer ..." mais un
# intitulé de type "File Operation Progress" (Thunar ne traduit pas
# toujours ce dialogue précis même en locale FR). Couverture large EN+FR
# en attendant confirmation du vrai titre (hyprctl clients -j pendant que
# la barre de progression est affichée).
windowrule = float on, match:title ^(.*File Operation Progress.*)$
windowrule = float on, match:title ^(.*[Pp]rogress.*)$
windowrule = float on, match:title ^(.*[Pp]rogression.*)$
windowrule = float on, match:title ^(.*[Oo]pération sur les fichiers.*)$
windowrule = float on, match:title ^(.*[Cc]opie de fichiers.*)$
windowrule = float on, match:title ^(.*[Dd]éplacement de fichiers.*)$

# --- Popup réseau (waybar wifi) : nm-connection-editor / équivalents ---
# Signalé 23/08 : la fenêtre déclenchée depuis le module wifi de waybar
# s'ouvrait tuilée. Classe la plus courante pour ce type d'outil sur
# NetworkManager : nm-connection-editor. À vérifier/ajuster avec la vraie
# classe (`hyprctl clients -j` pendant que le popup est ouvert) — le nom
# exact dépend de l'outil réellement lancé au clic (nm-applet, nmtui dans
# un terminal, iwgtk, etc., pas forcément nm-connection-editor).
windowrule = float on, match:class ^(nm-connection-editor)$
windowrule = float on, match:title ^(.*Network Connections.*)$
windowrule = float on, match:title ^(.*[Cc]onnexions? [Rr]éseau.*)$

# Titres CONFIRMÉS en live le 23/08 (capture d'écran) — remplacent les
# suppositions ci-dessus, qui restent en place en filet de sécurité :
windowrule = float on, match:title ^(.*Opération sur des fichiers en cours.*)$
windowrule = float on, match:title ^(.*Ce dossier contient déjà un (dossier|fichier).*)$

# --- Popup Emoji-Picker ---
windowrule = match:title ^(Emoji Picker)$, float on

# Nord Violet Control Center — panneau rapide compact ; le QML l'ancre en bas à droite.
windowrulev2 = float,title:^(Nord Violet Control Center)$
windowrulev2 = size 620 320,title:^(Nord Violet Control Center)$

# Nord Violet — Réglages : application Atelier séparée du panneau rapide.
windowrulev2 = float,title:^(Nord Violet - Réglages)$
windowrulev2 = size 1180 760,title:^(Nord Violet - Réglages)$
windowrulev2 = center,title:^(Nord Violet - Réglages)$

# v47 — même politique que le Control Center : position immédiatement
# appliquée par Hyprland ; seul le fondu QML anime le contenu.
# Un retour « ok » de movewindowpixel ne signifie pas la fin d'une animation.
windowrule = no_anim on, match:title ^(Nord Violet Audio Flyout)$
windowrule = no_shadow on, match:title ^(Nord Violet Audio Flyout)$
windowrule = no_blur on, match:title ^(Nord Violet Audio Flyout)$
windowrule = no_anim on, match:title ^(Nord Violet Wifi Flyout)$
windowrule = no_shadow on, match:title ^(Nord Violet Wifi Flyout)$
windowrule = no_blur on, match:title ^(Nord Violet Wifi Flyout)$

# Panneau Son : bordure neutre dessinée par QML, comme le calendrier.
windowrule = border_size 0, match:title ^(Nord Violet Audio Flyout)$

# Falcon : préparation masquée, sans animation de placement.
windowrule = workspace special:nvfalcon silent, match:class ^(falcon-popup)$
windowrule = float on, match:class ^(falcon-popup)$
windowrule = no_anim on, match:class ^(falcon-popup)$
# Calculatrice native, fenêtre flottante centrée.
windowrule = match:title ^(Nord Violet Calculator)$, float on, center on
